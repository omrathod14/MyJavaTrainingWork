<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8" />
<title>QuizApp - Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<style>
body {
	background: #f8f9fa;
	min-height: 100vh;
	display: flex;
	flex-direction: column;
}

/* Gradient Navbar */
.navbar {
	background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
	box-shadow: 0 4px 10px rgb(24 40 72/ 0.3);
}

/* Hero Card */
.hero-card {
	border-radius: 1rem;
	box-shadow: 0 8px 20px rgb(0 0 0/ 0.1);
	background: white;
	padding: 3rem 2.5rem;
	transition: transform 0.3s ease;
}

.hero-card:hover {
	transform: translateY(-8px);
	box-shadow: 0 12px 30px rgb(0 0 0/ 0.15);
}

/* Buttons */
.btn-primary {
	background: #4b6cb7;
	border: none;
	box-shadow: 0 4px 12px rgb(75 108 183/ 0.5);
	transition: background 0.3s ease;
}

.btn-primary:hover {
	background: #182848;
	box-shadow: 0 6px 18px rgb(24 40 72/ 0.7);
}

.btn-outline-primary {
	border-color: #4b6cb7;
	color: #4b6cb7;
	transition: all 0.3s ease;
}

.btn-outline-primary:hover {
	background: #4b6cb7;
	color: white;
	border-color: #4b6cb7;
	box-shadow: 0 4px 12px rgb(75 108 183/ 0.6);
}

footer {
	margin-top: auto;
	background: #182848;
	color: #aab8ff;
}
</style>
</head>

<body>
	<nav class="navbar navbar-expand-lg navbar-dark">
		<div class="container">
			<a class="navbar-brand fs-3 fw-bold" href="#">QuizApp</a>
			<div>
				<a class="btn btn-outline-light me-2 shadow-sm" href="login.html">Login</a>
				<a class="btn btn-light shadow-sm" href="register.html">Register</a>
			</div>
		</div>
	</nav>

	<main
		class="container py-5 d-flex justify-content-center align-items-center"
		style="min-height: 75vh;">
		<div class="col-md-7 hero-card text-center">
			<h1 class="display-4 fw-bold mb-3">Welcome to QuizApp</h1>
			<p class="lead mb-4 text-secondary">Take short quizzes to test
				your knowledge. Log in or register to begin your learning journey!</p>
			<div>
				<a class="btn btn-primary btn-lg me-3 px-4 shadow-sm"
					href="login.html">Login</a> <a
					class="btn btn-outline-primary btn-lg px-4 shadow-sm"
					href="register.html">Register</a>
			</div>
		</div>
	</main>

	<footer class="text-center py-3">
		<small>© 2025 QuizApp • Demo Project</small>
	</footer>

	<!-- Bootstrap JS Bundle -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
