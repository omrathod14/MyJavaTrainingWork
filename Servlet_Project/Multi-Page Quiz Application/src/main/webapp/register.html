<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Register - QuizApp</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<style>
body {
	background: linear-gradient(135deg, #6a11cb, #2575fc);
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
}

.card {
	border-radius: 1rem;
	box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
}

.card-header {
	background: #fff;
	border-bottom: none;
	text-align: center;
	padding: 2rem 1rem 1rem 1rem;
	font-weight: 700;
	font-size: 1.8rem;
	color: #333;
}

form {
	padding: 0 2rem 2rem 2rem;
}

.form-label {
	font-weight: 600;
}

.btn-primary {
	background: #2575fc;
	border: none;
	font-size: 1.2rem;
	font-weight: 600;
	padding: 0.75rem;
	border-radius: 0.5rem;
	transition: background 0.3s ease;
}

.btn-primary:hover {
	background: #1a5de8;
}

.text-center {
	color: #eee;
}

.text-center a {
	color: #ffd700;
	text-decoration: none;
	font-weight: 600;
}

.text-center a:hover {
	text-decoration: underline;
}
</style>
</head>
<body>
	<div class="card shadow-sm" style="width: 400px;">
		<div class="card-header">Create an account</div>
		<div class="card-body">
			<!-- FORM submits to RegisterServlet (mapped via @WebServlet("/register")) -->
			<form action="register" method="post" novalidate>
				<div class="mb-3">
					<label class="form-label">Username</label> <input name="username"
						type="text" class="form-control" required
						placeholder="Enter your username">
				</div>

				<div class="mb-3">
					<label class="form-label">Password</label> <input name="password"
						type="password" class="form-control" required
						placeholder="Enter your password">
				</div>

				<div class="mb-3">
					<label class="form-label">Email</label> <input name="email"
						type="email" class="form-control" required
						placeholder="Enter your email">
				</div>

				<button class="btn btn-primary w-100" type="submit">Register</button>
			</form>

			<hr>
			<p class="text-center mb-0">
				Already have an account? <a href="login.html">Login</a>
			</p>
		</div>
	</div>
</body>
</html>
