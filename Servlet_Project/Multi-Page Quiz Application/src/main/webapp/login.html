<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<title>Login - QuizApp</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet" />
<style>
body {
	/* Soft gradient background */
	background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
	min-height: 100vh;
	display: flex;
	justify-content: center;
	align-items: center;
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.login-card {
	background: white;
	border-radius: 1rem;
	padding: 2.5rem 3rem;
	box-shadow: 0 10px 30px rgb(0 0 0/ 0.1);
	width: 100%;
	max-width: 400px;
	transition: transform 0.3s ease;
}

.login-card:hover {
	transform: translateY(-6px);
	box-shadow: 0 16px 40px rgb(0 0 0/ 0.15);
}

h2 {
	color: #4b3c8a;
	font-weight: 700;
}

label {
	font-weight: 600;
	color: #4b3c8a;
}

.btn-primary {
	background-color: #764ba2;
	border: none;
	box-shadow: 0 6px 12px rgb(118 75 162/ 0.5);
	transition: background-color 0.3s ease;
}

.btn-primary:hover {
	background-color: #5a357a;
	box-shadow: 0 8px 18px rgb(90 53 122/ 0.7);
}
</style>
</head>

<body>
	<div class="login-card shadow-sm">
		<h2 class="text-center mb-4">Login</h2>
		<form action="login" method="post" novalidate>
			<div class="mb-4">
				<label for="email" class="form-label">Email</label> <input
					type="email" id="email" name="email" class="form-control"
					placeholder="username@gmail.com" required autofocus />
			</div>
			<div class="mb-4">
				<label for="password" class="form-label">Password</label> <input
					type="password" id="password" name="password" class="form-control"
					placeholder="Enter your password" required />
			</div>
			<button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Login</button>
		</form>
	</div>
</body>

</html>
